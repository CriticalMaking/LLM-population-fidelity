[project]
name = "machine-bias-reproduction"
version = "0.1.0"
description = "Reproducible Mixtral happiness slice of the Machine Bias opinion-poll study"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "scipy>=1.12,<2",
    "seaborn>=0.13,<1",
    "statsmodels>=0.14,<1",
]

[project.optional-dependencies]
inference = [
    "llama-cpp-python==0.3.1",
]
# Pinned to the stack the culture adapters were trained with, so inference
# composes the LoRA onto weights in the same numeric format as training.
culture = [
    "torch==2.12.0",
    "transformers==5.8.1",
    "peft==0.19.1",
    "accelerate==1.13.0",
    "bitsandbytes==0.49.2",
    "huggingface-hub>=0.30",
    # Qwen3-VL-8B-Thinking-FP8 dispatches its fine-grained FP8 matmuls through
    # a Hub kernel; without this the first forward pass raises ImportError.
    # The range is transformers 5.8.1's own: 0.13+ made LayerRepository's
    # revision/version mandatory, which its _KERNEL_MAPPING does not pass.
    "kernels>=0.12,<0.13",
]

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pandas-stubs>=2.2",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/machine_bias_reproduction", "src/culture", "src/reports"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-config --strict-markers"
markers = [
    "integration: reads the complete archived replication package",
    "live_model: requires the 26.4 GB Mixtral GGUF",
    "live_culture: requires the staged culture adapters and a CUDA GPU",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]

[tool.ruff.lint.isort]
known-first-party = ["machine_bias_reproduction", "culture", "reports"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "scripts"]
strict = true
warn_unused_ignores = true
warn_unreachable = true
show_error_codes = true
pretty = true

# transformers is typed only when the culture extra is installed, which flips
# which ignores in this module are "unused". The module must type-check in both
# states, so it opts out of that particular warning rather than tracking the
# environment.
[[tool.mypy.overrides]]
module = ["culture.backend"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
    "matplotlib.*",
    "scipy.*",
    "seaborn.*",
    "statsmodels.*",
    "llama_cpp.*",
    "torch.*",
    "transformers.*",
    "peft.*",
    "bitsandbytes.*",
    "huggingface_hub.*",
    "sklearn.*",
]
ignore_missing_imports = true
