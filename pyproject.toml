[project]
name = "towards-socially-grounded-ai-safety"
version = "0.1.0"
description = "Reproduction of the Machine Bias opinion-poll study, extended to culture-finetuned LLMs"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "scipy>=1.12,<2",
    "seaborn>=0.13,<1",
    "statsmodels>=0.14,<1",
]

[project.optional-dependencies]
inference = [
    "llama-cpp-python==0.3.1",
]
# The training stack, pinned so inference composes the LoRA onto weights in
# the numeric format it was trained against.
culture = [
    "torch==2.12.0",
    "transformers==5.8.1",
    "peft==0.19.1",
    "accelerate==1.13.0",
    "bitsandbytes==0.49.2",
    "huggingface-hub>=0.30",
]
muse = [
    "torch==2.12.0",
    "transformers==5.15.0",
    "peft==0.19.1",
    "accelerate==1.13.0",
    "bitsandbytes==0.49.2",
    "huggingface-hub>=0.30",
]

[tool.uv]
conflicts = [[{ extra = "culture" }, { extra = "muse" }]]

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pandas-stubs>=2.2",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/machine_bias_reproduction", "src/culture", "src/context_injection", "src/reports"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-config --strict-markers"
markers = [
    "integration: reads the complete archived replication package",
    "live_model: requires the 26.4 GB Mixtral GGUF",
    "live_culture: requires the staged culture adapters and a CUDA GPU",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]

[tool.ruff.lint.isort]
known-first-party = ["machine_bias_reproduction", "culture", "context_injection", "reports"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_unused_ignores = true
warn_unreachable = true
show_error_codes = true
pretty = true

# transformers is typed only with the culture extra installed, which flips
# which ignores here are "unused"; the module must type-check in both states.
[[tool.mypy.overrides]]
module = ["culture.backend"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
    "matplotlib.*",
    "scipy.*",
    "seaborn.*",
    "statsmodels.*",
    "llama_cpp.*",
    "torch.*",
    "transformers.*",
    "peft.*",
    "bitsandbytes.*",
    "huggingface_hub.*",
    "sklearn.*",
]
ignore_missing_imports = true
