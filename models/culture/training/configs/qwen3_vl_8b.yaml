model:
  id: "Qwen/Qwen3-VL-8B-Thinking"
  backend: "hf"                  # auto-detects cuda > mps > cpu at runtime
  dtype: "bfloat16"
  image_max_pixels: 200704       # 448×448

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  layers: 8
  target_modules:
    - "q_proj"
    - "v_proj"
    - "k_proj"
    - "o_proj"

training:
  batch_size: 2
  gradient_accumulation: 8       # effective batch = 16
  max_epochs: 250
  learning_rate: 2.0e-4
  lr_schedule: "cosine"
  warmup_steps: 50
  early_stopping_patience: 15
  early_stopping_min_epochs: 20
  max_seq_len: 512
  logging_steps: 25
  eval_steps: 100
  save_steps: 100
  max_grad_norm: 0.3
  gradient_checkpointing: true   # ~17.5 GB of bf16 weights resident on a 32 GB card

cultures:
  - arabic
  - bengali
  - chinese
  - english
  - german
  - korean
  - portuguese
  - spanish
  - turkish

n_folds: 5

mlflow:
  experiment: "culture_mllm_training"
  tracking_uri: "http://127.0.0.1:5000"
